<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Focus · Ötletek és referenciák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#0b0b0d;--panel:#131317;--card:#18181d;--line:#2a2a30;--line2:#3a3a42;--txt:#f2f2f2;--mut:#8a8a92;--sub:#cfcfd4;--acc:#d4ff3a;--red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:40px 20px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
h1{font-size:34px;font-weight:600;margin:6px 0 0;letter-spacing:-.02em}
h1 span{color:var(--acc)}
h2{font-size:22px;font-weight:600;margin:0}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
select,input,textarea,button{font-family:inherit;font-size:14px}
select,input,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:64px;width:100%}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--txt);padding:9px 14px}
.btn{background:var(--acc);color:#0b0b0d;border:none;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.banner{margin-top:20px;padding:12px 14px;border:1px solid #5a4a14;background:#211c0a;color:#f5d97a;border-radius:10px;font-size:13px}
.sec{border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:22px;background:var(--panel)}
.sech{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#0b0b0d;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.count{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--line);color:var(--sub)}
.sub{margin-top:22px}
.idea{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:8px;background:var(--card)}
.idea .ic{color:var(--acc);font-size:19px;margin-top:1px}
.idea .t{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--line);color:var(--sub)}
.act{display:flex;gap:6px;margin-left:auto;flex-shrink:0;align-items:center}
.vote{width:34px;height:32px;padding:0;border:none;background:none;position:relative;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.vote:hover{transform:scale(1.1)}
.vote svg{position:absolute;inset:0;width:100%;height:100%}
.vote svg path{fill:none;stroke:var(--line2);stroke-width:1.6}
.vote.on svg path{fill:#ff3d6e;stroke:#ff3d6e}
.vote span{position:relative;font-size:11px;font-weight:600;color:var(--sub);margin-top:-2px}
.vote.on span{color:#fff}
.vote.lock{cursor:default;opacity:.75}
.del{width:30px;height:30px;padding:0;border:none;color:var(--mut);font-size:17px}
.del:hover{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:8px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;background-size:cover;background-position:center}
.thumb .play{width:44px;height:44px;border-radius:50%;background:#0b0b0dcc;display:flex;align-items:center;justify-content:center;font-size:20px}
.badge{position:absolute;top:8px;left:8px;font-size:11px;padding:3px 9px;border-radius:20px;background:#0b0b0dd9;color:var(--txt);display:flex;gap:4px;align-items:center}
.cdel{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border-radius:50%;border:none;background:#0b0b0dd9;color:var(--sub);font-size:15px}
.cdel:hover{color:var(--red)}
.cb{padding:10px 12px;display:flex;align-items:center;gap:8px}
.ct{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs{font-size:11px;color:var(--mut)}
.add{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.add input{flex:1}
.msg{font-size:13px;margin-top:6px;min-height:0}
.msg.err{color:var(--red)}.msg.ok{color:var(--acc)}
.empty{font-size:13px;color:var(--mut);padding:10px 2px}
.ov{position:fixed;inset:0;background:#000000d9;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:720px;max-height:92vh;overflow:auto}
.modal.v{max-width:400px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mh .t{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.h169{padding-top:56.25%}.h916{padding-top:178%}
.cwrap{padding:0 12px 12px;cursor:default}
.cwrap .thread{margin-top:0}
.cwrap .cform .btn{padding:8px 10px}
.t.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.more{border:none;padding:4px 0;margin-top:4px;font-size:12px;color:var(--acc);display:inline-flex;gap:4px;align-items:center;background:none}
.cbtn{border:none;padding:4px 8px;font-size:12px;color:var(--sub);display:inline-flex;gap:5px;align-items:center;border-radius:20px;background:var(--line)}
.cbtn:hover{color:var(--acc)}
.thread{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.cm{display:flex;gap:9px;margin-top:8px}
.cav{width:26px;height:26px;border-radius:50%;background:var(--line2);color:var(--txt);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.cav.own{background:var(--acc);color:#0b0b0d}
.cbody{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chead{font-size:11px;color:var(--mut);display:flex;gap:8px;align-items:center}
.chead b{color:var(--sub);font-weight:500}
.ctext{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.cdelx{margin-left:auto;border:none;padding:0;color:var(--mut);font-size:13px}
.cdelx:hover{color:var(--red)}
.cform{display:flex;gap:8px;margin-top:10px}
.cform input{flex:1;min-width:0;padding:8px 10px;font-size:13px}
.cform .btn{padding:8px 12px}
.mf{display:flex;justify-content:flex-end;margin-top:10px}
.mf a{color:var(--acc);font-size:13px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
@media(max-width:600px){h1{font-size:26px}.idea{flex-wrap:wrap}.act{margin-left:0}.add{flex-direction:column}.add .btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="lbl">Deep Focus · csapat</div><h1>Ötletek és <span>referenciák</span></h1></div>
    <div class="who"><i class="ti ti-user"></i> Ki vagy?
      <select id="me"><option value="">Válassz…</option><option value="AD">Adrián</option><option value="TO">Tomi</option><option value="ZO">Zoli</option></select>
    </div>
  </header>
  <div id="banner"></div>
  <div id="root"></div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   1) IDE MÁSOLD BE A FIREBASE PROJEKTED ADATAIT
   Firebase console → Project settings → Your apps → Web app → Config
   Ha üresen hagyod, az oldal csak a saját gépeden (böngészőben) ment.
   ============================================================ */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  databaseURL: "https://deepfocus-otletek-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "deepfocus-otletek",
  appId: ""
};
</script>
<script>
const PEOPLE=[{k:"AD",n:"Adrián"},{k:"TO",n:"Tomi"},{k:"ZO",n:"Zoli"}];
const P={
  youtube:{n:'YouTube',ic:'brand-youtube',bg:'#3a1414',c:'#ff4d4d'},
  tiktok:{n:'TikTok',ic:'brand-tiktok',bg:'#10262a',c:'#25f4ee'},
  instagram:{n:'Instagram',ic:'brand-instagram',bg:'#35152b',c:'#f77fbe'},
  facebook:{n:'Facebook',ic:'brand-facebook',bg:'#14223a',c:'#5b9cff'},
  vimeo:{n:'Vimeo',ic:'brand-vimeo',bg:'#10283a',c:'#4fc3ff'},
  other:{n:'Link',ic:'link',bg:'#222228',c:'#d4ff3a'}
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Platform felismerés + beágyazás ---------- */
function parse(url){
  let u; try{u=new URL(url)}catch{return null}
  const h=u.hostname.replace(/^www\.|^m\./,''), p=u.pathname;
  let m;
  if(/(^|\.)youtube\.com$|^youtu\.be$/.test(h)){
    let id = h==='youtu.be' ? p.slice(1).split('/')[0] : (u.searchParams.get('v') || ((m=p.match(/\/(shorts|embed|live)\/([\w-]{6,})/))&&m[2]));
    const vertical=/\/shorts\//.test(p);
    return {pl:'youtube',id,vertical,embed:id&&`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`,thumb:id&&`https://i.ytimg.com/vi/${id}/hqdefault.jpg`};
  }
  if(/tiktok\.com$/.test(h)){
    m=p.match(/\/video\/(\d+)/);
    return {pl:'tiktok',id:m&&m[1],vertical:true,embed:m&&`https://www.tiktok.com/embed/v2/${m[1]}`};
  }
  if(/instagram\.com$/.test(h)){
    m=p.match(/\/(p|reel|reels|tv)\/([\w-]+)/);
    return {pl:'instagram',id:m&&m[2],vertical:true,embed:m&&`https://www.instagram.com/${m[1]==='reels'?'reel':m[1]}/${m[2]}/embed`};
  }
  if(/facebook\.com$|^fb\.watch$/.test(h)){
    const vertical=/\/reel\//.test(p);
    return {pl:'facebook',vertical,embed:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&autoplay=true`};
  }
  if(/vimeo\.com$/.test(h)){
    m=p.match(/\/(\d+)/);
    return {pl:'vimeo',id:m&&m[1],vertical:false,embed:m&&`https://player.vimeo.com/video/${m[1]}?autoplay=1`};
  }
  return {pl:'other',embed:null};
}
async function fetchMeta(url,info){
  // Cím és bélyegkép lekérése, ahol kulcs nélkül elérhető
  try{
    if(info.pl==='tiktok'){
      const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(url));
      if(r.ok){const j=await r.json();const vid=j.embed_product_id||(j.html||'').match(/data-video-id="(\d+)"/)?.[1];return {title:j.title||j.author_name,thumb:j.thumbnail_url,embed:vid?`https://www.tiktok.com/embed/v2/${vid}`:null}}
    }
    if(info.pl==='youtube'||info.pl==='vimeo'){
      const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent(url));
      if(r.ok){const j=await r.json();if(!j.error)return {title:j.title,thumb:j.thumbnail_url||info.thumb}}
    }
  }catch(e){}
  return {};
}

/* ---------- Tárolás: Firebase vagy helyi ---------- */
let state={}; const listeners=[];
const useFB=!!firebaseConfig.databaseURL;
let db=null;
const LS='df-otletek-v1';
function lsSave(){localStorage.setItem(LS,JSON.stringify(state))}
const store={
  init(cb){
    if(useFB){
      firebase.initializeApp(firebaseConfig);
      db=firebase.database().ref('board');
      db.on('value',s=>{state=s.val()||{};cb()});
    }else{
      try{state=JSON.parse(localStorage.getItem(LS))||{}}catch{state={}}
      cb();
    }
  },
  push(path,val){
    if(useFB) return db.child(path).push(val).key;
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    setPath(path+'/'+id,val);lsSave();render();return id;
  },
  set(path,val){
    if(useFB) return db.child(path).set(val);
    setPath(path,val);lsSave();render();
  },
  update(path,val){
    if(useFB) return db.child(path).update(val);
    const cur=getPath(path)||{};setPath(path,Object.assign(cur,val));lsSave();render();
  }
};
function getPath(p){return p.split('/').reduce((o,k)=>o&&o[k],state)}
function setPath(p,v){const ks=p.split('/');let o=state;ks.slice(0,-1).forEach(k=>{o[k]=o[k]||{};o=o[k]});if(v===null)delete o[ks.at(-1)];else o[ks.at(-1)]=v}

/* ---------- Felhasználó ---------- */
const meSel=document.getElementById('me');
let me=localStorage.getItem('df-me')||'';
meSel.value=me;
meSel.onchange=()=>{me=meSel.value;localStorage.setItem('df-me',me);render()};

/* ---------- Megjelenítés ---------- */
const msgs={};
function sorted(obj){return Object.entries(obj||{}).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0))}
function votes(owner,path,v){
  return PEOPLE.filter(p=>p.k!==owner).map(p=>{
    const on=v&&v[p.k], mine=me===p.k;
    return `<button class="vote ${on?'on':''} ${mine?'':'lock'}" title="${p.n} ${on?'tetszik neki':'még nem értékelte'}${mine?'':' – csak '+p.n+' kattinthat'}" data-vote="${path}" data-who="${p.k}"><svg viewBox="0 0 24 22"><path d="M12 20.5s-8.5-5.2-8.5-11.3A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.5 2.8C20.5 15.3 12 20.5 12 20.5z"/></svg><span>${p.n[0]}</span></button>`;
  }).join('');
  if(openPath){const x=getPath(openPath),mc=document.getElementById('mcom'); if(!x)closePlayer(); else if(mc) mc.innerHTML=thread(openPath,x.comments)}
  if(focusDraft){const el=document.querySelector(`[data-draft="${focusDraft}"]`); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
}
let openPath=null, focusDraft=null;
document.addEventListener('input',e=>{const d=e.target.dataset.draft; if(d){drafts[d]=e.target.value; focusDraft=d}});
document.addEventListener('focusin',e=>{focusDraft=e.target.dataset.draft||null});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.draft){e.preventDefault();sendComment(e.target.dataset.draft)}});
function sendComment(path){
  if(!me){alert('Előbb válaszd ki fent, ki vagy.');return}
  const t=(drafts[path]||'').trim(); if(!t)return;
  drafts[path]=''; store.push(path+'/comments',{who:me,text:t,ts:Date.now()});
}
const openTh=new Set(), openTx=new Set(), drafts={};
const isLong=t=>(t||'').length>240||(t||'').split('\n').length>5;
const nameOf=k=>(PEOPLE.find(p=>p.k===k)||{}).n||k;
function fmt(ts){const d=new Date(ts);return d.toLocaleDateString('hu-HU',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'})}
function thread(path,comments){
  const list=sorted(comments);
  return `<div class="thread">${list.length?list.map(([cid,c])=>`<div class="cm"><div class="cav ${c.who===me?'own':''}">${esc(c.who)}</div><div class="cbody"><div class="chead"><b>${esc(nameOf(c.who))}</b><span>${fmt(c.ts)}</span>${c.who===me?`<button class="cdelx" title="Komment törlése" data-cdel="${path}/comments/${cid}"><i class="ti ti-x"></i></button>`:''}</div><div class="ctext">${esc(c.text)}</div></div></div>`).join(''):'<div class="cs">Még nincs komment. Írd meg az elsőt.</div>'}
  <div class="cform"><input data-draft="${path}" value="${esc(drafts[path]||'')}" placeholder="${me?'Írj kommentet…':'Előbb válaszd ki fent, ki vagy'}"><button class="btn" data-comment="${path}"><i class="ti ti-send"></i></button></div></div>`;
}
const ccount=c=>Object.keys(c||{}).length;
function render(){
  document.getElementById('banner').innerHTML = useFB ? '' :
    `<div class="banner"><i class="ti ti-alert-triangle"></i> Helyi mód: az adatok csak ebben a böngészőben mentődnek. A közös használathoz másold be a Firebase adatokat az index.html elejére.</div>`;
  document.getElementById('root').innerHTML=PEOPLE.map(p=>{
    const d=state[p.k]||{}, ideas=sorted(d.ideas), links=sorted(d.links), m=msgs[p.k]||{};
    return `<section class="sec">
      <div class="sech"><div class="av">${p.k}</div><h2>${p.n}</h2><span class="count">${ideas.length} ötlet · ${links.length} videó</span></div>

      <div class="sub"><div class="lbl">Ötletek</div>
      ${ideas.length?ideas.map(([id,x])=>`<div class="idea">
          <i class="ti ti-${x.type==='Forgatókönyv'?'movie':'bulb'} ic"></i>
          <div style="flex:1;min-width:0"><div class="t ${isLong(x.text)&&!openTx.has(id)?'clamp':''}">${esc(x.text)}</div>${isLong(x.text)?`<button class="more" data-expand="${id}"><i class="ti ti-chevron-${openTx.has(id)?'up':'down'}"></i> ${openTx.has(id)?'Összecsukás':'Teljes szöveg'}</button>`:''}
            <div class="meta"><span class="tag">${esc(x.type)}</span>${x.by?`<span class="cs">beküldte: ${esc(x.by)}</span>`:''}<button class="cbtn" data-toggle="${p.k}/ideas/${id}"><i class="ti ti-message-circle"></i> ${ccount(x.comments)||''} ${ccount(x.comments)?'komment':'Kommentelés'}</button></div>
            ${openTh.has(`${p.k}/ideas/${id}`)?thread(`${p.k}/ideas/${id}`,x.comments):''}</div>
          <div class="act">${votes(p.k,`${p.k}/ideas/${id}/votes`,x.votes)}<button class="del" title="Törlés" data-del="${p.k}/ideas/${id}"><i class="ti ti-trash"></i></button></div>
        </div>`).join(''):`<div class="empty">Még nincs ötlet. Írd be az elsőt lent.</div>`}
      <div class="add" style="flex-direction:column">
        <textarea id="i-${p.k}" placeholder="Új ötlet, vagy egy teljes forgatókönyv…"></textarea>
        <div style="display:flex;gap:8px;width:100%;flex-wrap:wrap">
          <select id="it-${p.k}"><option>Ötlet</option><option>Forgatókönyv</option></select>
          <button class="btn" data-addidea="${p.k}"><i class="ti ti-plus"></i> Hozzáad</button>
        </div>
      </div></div>

      <div class="sub"><div class="lbl">Videós linkek</div>
      ${links.length?`<div class="cards">${links.map(([id,x])=>{const q=P[x.pl]||P.other;return `<div class="card" data-open="${p.k}/links/${id}">
          <div class="thumb" style="background-color:${q.bg};color:${q.c};${x.thumb?`background-image:linear-gradient(#0000,#0008),url('${esc(x.thumb)}')`:''}">
            <span class="badge"><i class="ti ti-${q.ic}"></i> ${q.n}</span>
            <button class="cdel" title="Törlés" data-del="${p.k}/links/${id}"><i class="ti ti-trash"></i></button>
            <span class="play"><i class="ti ti-${x.embed?'player-play':'external-link'}"></i></span>
          </div>
          <div class="cb"><div style="flex:1;min-width:0"><div class="ct">${esc(x.title||x.short)}</div><div class="cs">${esc(x.by?'beküldte: '+x.by:x.short)}${ccount(x.comments)?` · <i class="ti ti-message-circle"></i> ${ccount(x.comments)}`:''}</div></div>
            <div class="act">${votes(p.k,`${p.k}/links/${id}/votes`,x.votes)}</div></div>
          <div class="cwrap">${thread(`${p.k}/links/${id}`,x.comments)}</div>
        </div>`}).join('')}</div>`:`<div class="empty">Még nincs videó. Illessz be egy vagy több linket lent.</div>`}
      <div class="add"><textarea id="l-${p.k}" placeholder="Illessz be egy vagy több linket (soronként egyet)&#10;https://www.tiktok.com/@…/video/…&#10;https://www.instagram.com/reel/…"></textarea>
        <button class="btn" data-addlinks="${p.k}"><i class="ti ti-link"></i> Kártyák</button></div>
      <div class="msg ${m.c||''}">${esc(m.t||'')}</div></div>
    </section>`;
  }).join('');
}

/* ---------- Műveletek ---------- */
const myName=()=> (PEOPLE.find(p=>p.k===me)||{}).n||'';
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open]'); if(!t)return;
  if(t.dataset.open&&e.target.closest('.cwrap'))return;
  if(t.dataset.vote){
    e.stopPropagation();
    if(me!==t.dataset.who){alert(me?'Ezt a gombot csak '+PEOPLE.find(p=>p.k===t.dataset.who).n+' nyomhatja meg.':'Előbb válaszd ki fent, ki vagy.');return}
    const path=t.dataset.vote+'/'+me, cur=getPath(path);
    store.set(path,cur?null:true);return;
  }
  if(t.dataset.expand){const k=t.dataset.expand; openTx.has(k)?openTx.delete(k):openTx.add(k); render(); return;}
  if(t.dataset.toggle){const k=t.dataset.toggle; openTh.has(k)?openTh.delete(k):openTh.add(k); focusDraft=openTh.has(k)?k:null; render(); return;}
  if(t.dataset.comment){ sendComment(t.dataset.comment); return; }
  if(t.dataset.cdel){ e.stopPropagation(); if(confirm('Törlöd a kommentet?')) store.set(t.dataset.cdel,null); return; }
  if(t.dataset.del){
    e.stopPropagation();
    if(confirm('Biztosan törlöd?')) store.set(t.dataset.del,null);return;
  }
  if(t.dataset.addidea){
    const k=t.dataset.addidea, ta=document.getElementById('i-'+k), v=ta.value.trim();
    if(!v){ta.focus();return}
    store.push(k+'/ideas',{text:v,type:document.getElementById('it-'+k).value,by:myName(),ts:Date.now()});return;
  }
  if(t.dataset.addlinks){ addLinks(t.dataset.addlinks); return; }
  if(t.dataset.open){ openPlayer(t.dataset.open); }
});
async function addLinks(k){
  const raw=document.getElementById('l-'+k).value.split(/[\s,]+/).filter(Boolean);
  const good=[],bad=[];
  raw.forEach(v=>{ if(!/^https?:\/\//i.test(v)) v='https://'+v; const i=parse(v); (i?good:bad).push([v,i]) });
  if(!good.length){msgs[k]={c:'err',t:'Adj meg legalább egy érvényes linket.'};render();return}
  msgs[k]={c:'ok',t:`${good.length} kártya hozzáadva`+(bad.length?` · ${bad.length} hibás link kihagyva`:'')};
  for(const [url,info] of good){
    const short=url.replace(/^https?:\/\/(www\.)?/,'').slice(0,40);
    const id=store.push(k+'/links',{url,short,pl:info.pl,embed:info.embed||null,vertical:!!info.vertical,thumb:info.thumb||null,by:myName(),ts:Date.now()});
    fetchMeta(url,info).then(meta=>{ const u={}; if(meta.title)u.title=meta.title; if(meta.thumb||info.thumb)u.thumb=meta.thumb||info.thumb; if(meta.embed&&!info.embed)u.embed=meta.embed; if(Object.keys(u).length) store.update(k+'/links/'+id,u) });
  }
  render();
}
function openPlayer(path){
  const x=getPath(path); if(!x)return;
  if(x.pl==='tiktok'){
    const w=420,h=760,l=Math.max(0,(window.screenX||0)+window.outerWidth-w-40),t=Math.max(0,(window.screenY||0)+60);
    const pop=window.open(x.url,'df-tiktok',`popup=yes,width=${w},height=${h},left=${l},top=${t}`);
    if(!pop) window.open(x.url,'_blank','noopener');
    return;
  }
  openPath=path;
  const q=P[x.pl]||P.other, modal=document.getElementById('modal');
  modal.className='modal'+(x.vertical?' v':'');
  modal.innerHTML=`<div class="mh"><span class="tag"><i class="ti ti-${q.ic}"></i> ${q.n}</span><div class="t">${esc(x.title||x.short)}</div><button id="cls" title="Bezárás"><i class="ti ti-x"></i></button></div>
    ${x.embed?`<div class="frame ${x.vertical?'h916':'h169'}"><iframe src="${esc(x.embed)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`:''}
    <div class="mf"><a href="${esc(x.url)}" target="_blank" rel="noopener">Megnyitás itt: ${q.n} <i class="ti ti-external-link"></i></a></div>
    <div class="lbl" style="margin-top:6px">Kommentek</div><div id="mcom">${thread(path,x.comments)}</div>`;
  document.getElementById('ov').classList.add('show');
  document.getElementById('cls').onclick=closePlayer;
}
function closePlayer(){openPath=null;document.getElementById('ov').classList.remove('show');document.getElementById('modal').innerHTML=''}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closePlayer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer()});

let repaired=false;
function repair(){ if(repaired)return; repaired=true;
  for(const p of PEOPLE) for(const [id,x] of Object.entries((state[p.k]||{}).links||{}))
    if(x.pl==='tiktok'&&!x.embed) fetchMeta(x.url,{pl:'tiktok'}).then(m=>{ const u={}; if(m.embed)u.embed=m.embed; if(m.thumb&&!x.thumb)u.thumb=m.thumb; if(m.title&&!x.title)u.title=m.title; if(Object.keys(u).length) store.update(p.k+'/links/'+id,u) });
}
store.init(()=>{render();repair()});
</script>
